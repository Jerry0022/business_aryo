<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#17130f" />
    <title>Offline · Aryo Sabouri</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #17130f;
        color: #f8f4ed;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main {
        max-width: 26rem;
      }
      svg {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 28px 0 12px;
        font-family: ui-serif, Georgia, serif;
        font-weight: 500;
        font-size: 2rem;
        line-height: 1.15;
      }
      p {
        margin: 0 0 28px;
        color: rgb(248 244 237 / 0.7);
        line-height: 1.6;
      }
      button {
        border: 0;
        border-radius: 9999px;
        padding: 14px 28px;
        background: #d8712c;
        color: #17130f;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: #deb27c;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#241d17" />
        <g stroke="#17130f" stroke-width="0.6" stroke-linejoin="round">
          <polygon points="5.5,7.3 18.4,7.3 18.4,10.3 5.5,10.3" fill="#e8c28c" />
          <polygon points="19,7.3 26.5,7.3 26.5,10.3 19,10.3" fill="#c99352" />
          <polygon points="5.5,10.9 9.4,10.9 9.4,13.9 5.5,13.9" fill="#b57a3e" />
          <polygon points="10,10.9 26.5,10.9 26.5,13.9 10,13.9" fill="#dca565" />
          <polygon points="5.5,14.5 21.4,14.5 21.4,17.5 5.5,17.5" fill="#d8712c" />
          <polygon points="22,14.5 26.5,14.5 26.5,17.5 22,17.5" fill="#e8c28c" />
          <polygon points="5.5,18.1 13.4,18.1 13.4,21.1 5.5,21.1" fill="#dca565" />
          <polygon points="14,18.1 26.5,18.1 26.5,21.1 14,21.1" fill="#a0602a" />
          <polygon points="5.5,21.7 23.4,21.7 23.4,24.7 5.5,24.7" fill="#c99352" />
          <polygon points="24,21.7 26.5,21.7 26.5,24.7 24,24.7" fill="#dca565" />
        </g>
      </svg>
      <h1>Gerade keine Verbindung</h1>
      <p>
        Die Seite braucht Internet. Sobald Sie wieder online sind, geht es weiter – oder schreiben Sie mir später an
        <strong>aryo.kontakt@gmail.com</strong>.
      </p>
      <button type="button" onclick="location.reload()">Erneut versuchen</button>
    </main>
    <script>
      addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
