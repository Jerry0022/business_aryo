<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#22252a" />
    <title>Offline · Maximilian Parkett</title>
    <!-- Served by public/sw.js when a page cannot be loaded. Self-contained: no fonts, styles or scripts from the
         network. Keep name and e-mail in sync with src/config/site.ts (checked by tests/e2e/public.spec.ts). -->
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #e4e3de;
        color: #22252a;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main {
        max-width: 26rem;
      }
      svg {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 28px 0 12px;
        font-weight: 800;
        font-size: 1.9rem;
        line-height: 1.15;
      }
      p {
        margin: 0 0 28px;
        color: #3a3d43;
        line-height: 1.6;
      }
      button {
        border: 0;
        border-radius: 9999px;
        padding: 14px 28px;
        background: #2d5ba8;
        color: #f7f7f4;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: #1f4580;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 36 36" aria-hidden="true">
        <rect width="36" height="36" rx="6" fill="#f7f7f4" />
        <g transform="translate(0 3)">
          <rect x="1" y="3" width="20" height="6" fill="#c0894a" />
          <rect x="9" y="12" width="20" height="6" fill="#a8713a" />
          <rect x="1" y="21" width="20" height="6" fill="#c0894a" />
          <path d="M33 3v24M30 3h6M30 27h6" stroke="#2d5ba8" stroke-width="1.5" fill="none" />
        </g>
      </svg>
      <h1>Gerade keine Verbindung</h1>
      <p>
        Die Seite braucht Internet. Sobald du wieder online bist, geht es weiter. Oder schreib mir später an
        <strong>Maximilian.Parkett@gmail.com</strong>.
      </p>
      <button type="button" onclick="location.reload()">Erneut versuchen</button>
    </main>
    <script>
      addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
